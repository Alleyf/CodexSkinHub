<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d2b"/>
      <stop offset=".6" stop-color="#2b1554"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset=".55" stop-color="#e9d5ff"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <radialGradient id="glow" cx=".35" cy=".45" r=".7">
      <stop offset="0" stop-color="#c084fc" stop-opacity=".3"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- mark: deck + orbit (compact) -->
  <g transform="translate(84 40)">
    <ellipse cx="120" cy="120" rx="118" ry="66" fill="none" stroke="#e9d5ff" stroke-opacity=".2" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" transform="rotate(-14 120 120)"/>
    <circle cx="14" cy="132" r="5" fill="#f0abfc"/>
    <circle cx="226" cy="102" r="5" fill="#22d3ee"/>
    <g transform="rotate(-13 86 116)">
      <rect x="28" y="40" width="112" height="150" rx="18" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".18" stroke-width="2"/>
      <rect x="42" y="56" width="84" height="26" rx="10" fill="url(#cardA)" opacity=".85"/>
    </g>
    <rect x="88" y="32" width="112" height="158" rx="20" fill="#fdfcff"/>
    <rect x="88" y="32" width="112" height="40" rx="20" fill="url(#cardC)"/>
    <rect x="88" y="56" width="112" height="16" fill="url(#cardC)"/>
    <circle cx="106" cy="52" r="4" fill="#ffffff" fill-opacity=".9"/>
    <circle cx="120" cy="52" r="4" fill="#ffffff" fill-opacity=".5"/>
    <circle cx="134" cy="52" r="4" fill="#ffffff" fill-opacity=".3"/>
    <rect x="104" y="88" width="80" height="54" rx="10" fill="url(#cardA)" opacity=".92"/>
    <rect x="104" y="158" width="56" height="8" rx="4" fill="#31175e" opacity=".55"/>
    <rect x="104" y="172" width="80" height="8" rx="4" fill="#31175e" opacity=".28"/>
    <line x1="120" y1="120" x2="14" y2="130" stroke="#f0abfc" stroke-opacity=".45" stroke-width="2"/>
    <line x1="120" y1="120" x2="224" y2="120" stroke="#67e8f9" stroke-opacity=".45" stroke-width="2"/>
    <path d="M226 28 l6 17 17 6 -17 6 -6 17 -6 -17 -17 -6 17 -6 z" fill="#fde68a" opacity=".9"/>
  </g>

  <!-- wordmark -->
  <text x="330" y="158" font-family="Segoe UI, Arial, sans-serif" font-size="84" font-weight="700" fill="url(#word)" letter-spacing="1">CodexSkinHub</text>
  <rect x="334" y="186" width="240" height="6" rx="3" fill="url(#accent)"/>
  <text x="334" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#c4b5fd" letter-spacing=".5">主题热切换 · ZIP 导入 · 应用内设置面板 · 四层自愈</text>
  <text x="334" y="278" font-family="Consolas, monospace" font-size="24" fill="#8b7bd8">npm install -g codexskin-hub</text>
</svg>
